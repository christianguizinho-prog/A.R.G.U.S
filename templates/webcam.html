<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.R.G.U.S. • Webcam</title><style>body{margin:0;background:#030711;color:#fff;font-family:system-ui,sans-serif;height:100vh;overflow:hidden}.video{width:100vw;height:100vh;object-fit:contain;background:#000}.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(#02050fd9,transparent);opacity:.2;transition:.2s}.bar:hover{opacity:1}.btn{border:1px solid #38528c;border-radius:8px;background:#142448;color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}.dot{color:#3cf09d}</style></head><body><img class="video" id="feed" src="/webcam/feed?token={{ api_token }}" alt="Stream da webcam"><nav class="bar"><strong><span class="dot">●</span> A.R.G.U.S. Webcam</strong><div><button class="btn" onclick="toggleFull()">Tela cheia</button><button class="btn" onclick="stop()">Encerrar</button></div></nav><script>const token={{ api_token|tojson }};function toggleFull(){document.documentElement.requestFullscreen?.()}async function stop(){await fetch('/api/webcam/stop',{method:'POST',headers:{'X-API-Key':token}});document.getElementById('feed').removeAttribute('src')}</script></body></html>
